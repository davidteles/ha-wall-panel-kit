name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - name: Render the example home
        run: python tools/render.py my_home.example.yaml
      - name: Check the output parses and phones never get kiosk mode
        run: |
          python - <<'PY'
          import yaml
          tablet = yaml.safe_load(open("out/tablet.yaml"))
          phone = yaml.safe_load(open("out/phone.yaml"))
          assert tablet["views"] and phone["views"]
          assert "kiosk_mode" not in phone and "wallpanel" not in phone, "phone must never get kiosk or screensaver"
          print(len(tablet["views"]), "tablet views,", len(phone["views"]), "phone views")
          PY
      - name: Parse the theme
        run: python -c "import yaml; yaml.safe_load(open('themes/wall-panel.yaml')); print('theme ok')"
      - name: Check every blueprint
        run: python tools/check_blueprints.py
