blueprint:
  name: Entry — open a door or gate
  description: >-
    One script per door, gate or barrier. The kit's Entry page, the doorbell
    pop-up and the phone's **Open** button all run it.

    It works with whatever opens your door:

    - a **lock**: *open* if the lock supports it (an electric strike), otherwise *unlock*

    - a **button** or **Button helper**: press

    - a **switch** (a relay wired to the intercom's "door open" contact): on, wait, off

    - a **cover** (a gate or a garage): open


    After opening it fires the event `wall_panel_entry_opened`, so the ring
    automation closes the pop-up and clears the phones.


    **Sent is not opened.** Without a confirmation sensor the phones say
    "Open sent". Add the door's contact sensor (or the lock or cover itself)
    under *Confirms it opened*, and they say "opened" only when it really did.
  domain: script
  source_url: https://github.com/davidteles/ha-wall-panel-kit/blob/main/blueprints/script/entry/entry_open.yaml
  input:
    door_name:
      name: Name
      description: e.g. Building door, Gate. Shown on the button and in the log.
      default: Door
      selector: { text: {} }
    opener:
      name: What opens it
      selector: { entity: { domain: [lock, button, input_button, switch, cover] } }
    pulse:
      name: Relay pulse (switches only)
      description: How long a relay stays on. Most intercom door-release contacts need 1–3 seconds.
      default: 2
      selector: { number: { min: 0.5, max: 15, step: 0.5, unit_of_measurement: s } }

    confirm:
      name: Confirms it opened (optional)
      description: >-
        A door contact (on = open), or the lock / cover itself. Only a CHANGE
        after the tap counts: a contact turning on or a cover reaching open says
        "opened"; a lock turning unlocked says "unlocked" (the latch is free, the
        door may still be shut); a cover still moving says "opening". If it
        already showed open or unlocked before the tap, nothing can be confirmed
        and the phones are told the command was sent. Without a sensor, the
        phones are told the command was sent.
      default: []
      selector: { entity: { domain: [binary_sensor, lock, cover] } }
    confirm_seconds:
      name: Wait this long for the confirmation
      default: 10
      selector: { number: { min: 2, max: 60, unit_of_measurement: s } }
mode: single
icon: mdi:door-open

variables:
  door_name: !input door_name
  opener: !input opener
  pulse: !input pulse
  domain: "{{ opener.split('.')[0] }}"
  confirm_entity: !input confirm
  confirm_seconds: !input confirm_seconds
  has_confirm: "{{ confirm_entity not in ['', none, []] }}"

sequence:
  - variables:
      before: "{{ states(confirm_entity) if has_confirm else '' }}"
      already: "{{ has_confirm and before in ['on', 'open', 'opening', 'unlocked', 'unlocking'] }}"
  - choose:
      - conditions: "{{ domain == 'lock' and (state_attr(opener, 'supported_features') | int(0)) | bitwise_and(1) > 0 }}"
        sequence:
          - action: lock.open
            target: { entity_id: "{{ opener }}" }
      - conditions: "{{ domain == 'lock' }}"
        sequence:
          - action: lock.unlock
            target: { entity_id: "{{ opener }}" }
      - conditions: "{{ domain in ['button', 'input_button'] }}"
        sequence:
          - action: "{{ domain }}.press"
            target: { entity_id: "{{ opener }}" }
      - conditions: "{{ domain == 'switch' }}"
        sequence:
          - action: switch.turn_on
            target: { entity_id: "{{ opener }}" }
          - delay: { milliseconds: "{{ (pulse | float * 1000) | int }}" }
          - action: switch.turn_off
            target: { entity_id: "{{ opener }}" }
      - conditions: "{{ domain == 'cover' }}"
        sequence:
          - action: cover.open_cover
            target: { entity_id: "{{ opener }}" }
  - if:
      - alias: A sensor that did not already show open before the tap
        condition: template
        value_template: "{{ has_confirm and not already }}"
    then:
      # It wasn't open/unlocked before, so reaching one of these is a change caused after the tap.
      - wait_template: "{{ states(confirm_entity) in ['on', 'open', 'opening', 'unlocked'] }}"
        timeout: { seconds: "{{ confirm_seconds | int(10) }}" }
      - variables:
          got: "{{ states(confirm_entity) }}"
          result: >-
            {%- if not wait.completed -%}no
            {%- elif got in ['on', 'open'] -%}yes
            {%- elif got == 'unlocked' -%}unlocked
            {%- elif got == 'opening' -%}opening
            {%- else -%}no{%- endif -%}
      - event: wall_panel_entry_opened
        event_data:
          door: "{{ door_name }}"
          entity_id: "{{ opener }}"
          confirmed: "{{ result }}"
    else:
      - event: wall_panel_entry_opened
        event_data:
          door: "{{ door_name }}"
          entity_id: "{{ opener }}"
          confirmed: "{{ 'already' if already else 'unknown' }}"
