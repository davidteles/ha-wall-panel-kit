blueprint:
  name: Kiosk Satellite - clean the screen
  description: >-
    A script that turns touch off (Kiosk Satellite lockdown mode) for a minute
    so you can wipe the screen, then turns it back on. Put it on a button on
    the panel's settings page. Seven fast taps still exit early.
  domain: script
  source_url: https://github.com/davidteles/ha-wall-panel-kit/blob/main/blueprints/script/kiosk_satellite/clean_screen.yaml
  input:
    lockdown_switch:
      name: Kiosk Satellite lockdown mode switch
      selector: { entity: { domain: switch } }
    seconds:
      name: Seconds with touch off
      default: 60
      selector: { number: { min: 10, max: 300, unit_of_measurement: s } }

mode: restart
icon: mdi:spray-bottle

sequence:
  - action: switch.turn_on
    target: { entity_id: !input lockdown_switch }
  - delay: { seconds: !input seconds }
  - action: switch.turn_off
    target: { entity_id: !input lockdown_switch }
